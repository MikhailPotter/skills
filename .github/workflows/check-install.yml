name: Check skill installation

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and verify the proposed bundle
        run: python3 scripts/check-install.py
